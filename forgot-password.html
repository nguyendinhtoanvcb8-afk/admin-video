<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu – Video Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="auth-brand"><img src="assets/logo.svg" alt=""><span>Video Admin</span></div>
    <h1>Quên mật khẩu</h1>
    <div id="notice"></div>

    <form id="form1" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email"><div class="error-text hidden"></div></div>
      <button class="btn btn-primary btn-block" id="submit1" type="submit">Lấy mã khôi phục</button>
    </form>

    <form id="form2" class="hidden" novalidate>
      <div class="field"><label for="email2">Email</label><input class="input" id="email2" readonly><div class="hint"><a href="#" id="changeEmail">Đổi email</a></div></div>
      <div class="field"><label for="code">Mã khôi phục (6 chữ số)</label><input class="input" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div class="error-text hidden"></div></div>
      <div class="field"><label for="password">Mật khẩu mới</label><div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="new-password"><button type="button" class="pw-toggle" aria-label="Hiện/ẩn mật khẩu">👁</button></div><div class="error-text hidden"></div></div>
      <div class="field"><label for="password2">Nhập lại mật khẩu</label><input class="input" id="password2" type="password" autocomplete="new-password"><div class="error-text hidden"></div></div>
      <button class="btn btn-primary btn-block" id="submit2" type="submit">Đặt mật khẩu mới</button>
      <button class="btn btn-outline btn-block" id="resend" type="button" style="margin-top:8px">Gửi lại mã</button>
    </form>

    <div class="auth-links"><a href="login.html">← Quay lại đăng nhập</a></div>
  </div>
  <script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
