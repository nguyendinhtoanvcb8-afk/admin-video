<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh mục – Video Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app" class="app">
    <main class="content" data-content>
      <div class="page-head"><h1>Danh mục video</h1><button class="btn btn-primary" id="add" type="button">+ Thêm danh mục</button></div>
      <div class="card">
        <div id="state"></div>
        <div class="table-wrap hidden" id="table-wrap">
          <table><thead><tr><th>ID</th><th>Tên</th><th>Slug</th><th>Số video</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/categories.js"></script>
</body>
</html>
